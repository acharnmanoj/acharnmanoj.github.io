<!DOCTYPE html>
<html>
<head>
<title>Manoj GC | Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/scrollreveal"></script>
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
scroll-behavior:smooth;
}

body{
background:#0a192f;
color:white;
overflow-x:hidden;
position:relative;
}

/* ===== LIQUID BLOBS ===== */

.blob{
position:fixed;
width:500px;
height:500px;
background:radial-gradient(circle,#00e6ff,#0044ff);
border-radius:50%;
filter:blur(120px);
opacity:0.5;
animation:blobMove1 20s infinite alternate ease-in-out;
z-index:-2;
}

.blob2{
position:fixed;
width:500px;
height:500px;
background:radial-gradient(circle,#ff00ff,#4400ff);
border-radius:50%;
filter:blur(120px);
opacity:0.4;
animation:blobMove2 25s infinite alternate ease-in-out;
z-index:-2;
}

@keyframes blobMove1{
0%{transform:translate(-100px,-100px);}
100%{transform:translate(300px,200px);}
}

@keyframes blobMove2{
0%{transform:translate(600px,100px);}
100%{transform:translate(200px,400px);}
}

/* ===== MOUSE SPOTLIGHT ===== */

.cursor-light{
position:fixed;
width:400px;
height:400px;
background:radial-gradient(circle,rgba(0,230,255,0.25),transparent 70%);
border-radius:50%;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:-1;
}

/* ===== HEADER ===== */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
position:fixed;
width:100%;
background:rgba(10,25,47,0.6);
backdrop-filter:blur(10px);
}

header h2{
color:#00e6ff;
}

nav a{
text-decoration:none;
color:white;
margin-left:25px;
font-size:15px;
}

nav a:hover{
color:#00e6ff;
}

/* ===== HERO ===== */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding-top:80px;
}

.profile{
width:160px;
height:160px;
border-radius:50%;
border:4px solid #00e6ff;
box-shadow:0 0 40px #00e6ff;
margin-bottom:20px;
}

.hero h1{
font-size:34px;
margin-bottom:10px;
}

.typing{
color:#00e6ff;
font-weight:bold;
}

/* ===== BUTTONS ===== */

.buttons a{
padding:10px 25px;
border-radius:30px;
text-decoration:none;
margin:10px;
font-size:14px;
display:inline-block;
transition:0.3s;
}

.btn-primary{
background:#00e6ff;
color:black;
}

.btn-outline{
border:2px solid #00e6ff;
color:#00e6ff;
}

.btn-primary:hover{
box-shadow:0 0 20px #00e6ff;
}

.btn-outline:hover{
background:#00e6ff;
color:black;
}

/* ===== SECTIONS ===== */

section{
padding:100px 60px;
}

.section-title{
text-align:center;
font-size:26px;
margin-bottom:40px;
color:#00e6ff;
}

.cards{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
}

.card{
background:rgba(17,34,64,0.8);
padding:25px;
border-radius:15px;
width:300px;
transition:0.3s;
backdrop-filter:blur(10px);
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 20px rgba(0,230,255,0.5);
}

footer{
text-align:center;
padding:20px;
background:rgba(17,34,64,0.8);
}
</style>
</head>

<body>

<div class="blob"></div>
<div class="blob blob2"></div>
<div class="cursor-light"></div>

<header>
<h2>Manoj GC</h2>
<nav>
<a href="#skills">Skills</a>
<a href="#projects">Projects</a>
<a href="#internship">Internship</a>
<a href="#education">Education</a>
</nav>
</header>

<div class="hero">
<img src="https://via.placeholder.com/160" class="profile">
<h1>Electronics & Telecommunication Engineer</h1>
<p>I am skilled in <span class="typing"></span></p>

<div class="buttons">
<a href="resume.pdf" download class="btn-primary">Download Resume</a>
<a href="https://github.com/acharnmanoj" class="btn-outline">GitHub</a>
</div>
</div>

<section id="skills">
<h2 class="section-title">Technical Skills</h2>
<div class="cards">
<div class="card">
<h3>Programming</h3>
<p>C++, Python, SQL</p>
</div>
<div class="card">
<h3>Embedded Systems</h3>
<p>Arduino, ESP8266, ESP32</p>
</div>
<div class="card">
<h3>Tools</h3>
<p>MATLAB, Firebase, VS Code</p>
</div>
</div>
</section>

<footer>
© 2026 Manoj GC | Portfolio
</footer>

<script>

/* ===== Mouse Spotlight Movement ===== */
document.addEventListener("mousemove",function(e){
var light=document.querySelector(".cursor-light");
light.style.left=e.clientX+"px";
light.style.top=e.clientY+"px";
});

/* ===== Scroll Animation ===== */
ScrollReveal().reveal('.card',{
distance:'50px',
duration:1000,
origin:'bottom',
interval:200
});

/* ===== Typing Animation ===== */
var typed=new Typed(".typing",{
strings:["Embedded Systems","IoT Development","Dashboard Development","Communication Technologies"],
typeSpeed:50,
backSpeed:30,
loop:true
});
</script>

</body>
</html>
